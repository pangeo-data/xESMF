name: xesmf
channels:
  - conda-forge
dependencies:
  # Python pin only to accelerate solving
  - python>=3.14
  - cf_xarray>=0.5.1
  - esmpy >=8.0.0
  - numba >=0.55.2
  - numpy >=2
  - shapely
  - sparse>=0.8.0
  - xarray>=2025.1.1
  # Doc
  - numpydoc
  - geopandas
  - descartes
  - ipython
  - Pygments>=2.6
  - nbsphinx
  - sphinx>=9
  - sphinx_rtd_theme
  - docutils!=0.18
